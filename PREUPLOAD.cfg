# Per-project `repo upload` hook settings.
# https://android.googlesource.com/platform/tools/repohooks

[Options]
# The hooks will not run on commits that are merged.
# Hooks will still run on the merge commit itself.
ignore_merged_commits = true

[Builtin Hooks]
# Run Blueprint files (.bp) through bpfmt.
bpfmt = true
# Require a valid "Bug:" line.
commit_msg_bug_field = true
# Require a valid "Change-Id:" Gerrit line.
commit_msg_changeid_field = true
# Require a "Test:" line.
commit_msg_test_field = true
